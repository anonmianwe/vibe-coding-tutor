<!doctype html>
<!-- Automated test. Run a local server from the repo root (python3 -m http.server 8000),
     open http://localhost:8000/tests/play-test.html and read the RESULT line.
     Headless: google-chrome --headless=new --virtual-time-budget=150000 --dump-dom <url>
     It clears this site's saved progress and settings. -->
<meta charset="utf-8"><title>play test</title>
<body><pre id="out">running…</pre>
<iframe id="f" style="width:400px;height:900px;border:1px solid #999"></iframe>
<script>
const log = [];
const ok = (c, m) => log.push((c ? 'PASS ' : 'FAIL ') + m);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms = 6000) { const t = Date.now(); while (Date.now() - t < ms) { const v = fn(); if (v) return v; await wait(20); } return null; }

(async () => {
  localStorage.removeItem('vct3-progress');
  localStorage.removeItem('vct-settings');
  const f = document.getElementById('f');
  f.src = '../index.html#/';
  // wait until the app has drawn its first screen (slower on the live site than locally)
  await until(() => f.contentWindow.Puzzle && f.contentDocument.querySelector('#app .screen'), 20000);
  let w = f.contentWindow, d = f.contentDocument;
  const $ = (s) => d.querySelector(s), $$ = (s) => [...d.querySelectorAll(s)];
  const errs = [];
  w.addEventListener('error', (e) => errs.push(e.message));
  w.PUZZLE_DELAY = 0;
  const P = w.Puzzle;
  const { CHAPTERS, WORDS } = w.CONTENT;
  const LEVELS = [];
  CHAPTERS.forEach((ch) => ch.levels.forEach((def, k) => LEVELS.push({ ch, def, k })));
  const CHAL = CHAPTERS.map((ch) => ({ ch, def: ch.challenge, k: 'challenge' }));
  const noHScroll = (where) => ok(d.documentElement.scrollWidth <= d.documentElement.clientWidth + 1, `no sideways scroll at 400px: ${where}`);
  const visible = (el) => el && el.offsetParent !== null;

  // ---- 1. content and engine checks (no screen) ----
  ok(CHAPTERS.length === 6 && LEVELS.length === 18 && CHAL.every((c) => c.def), `6 chapters, ${LEVELS.length} levels, 6 challenges`);
  for (const { ch, def, k } of LEVELS.concat(CHAL)) {
    const name = k === 'challenge' ? `${ch.id} challenge` : `${ch.id} ${k + 1}`;
    const r = P.simulate(def, def.solution);
    ok(r.ok && r.blocks === def.best, `${name}: solution works and best = ${def.best} ${r.ok ? '' : r.msg}`);
    if (def.start) ok(!P.simulate(def, def.start).ok, `${name}: the buggy start program really fails`);
    for (const lang of ['python', 'c']) {
      // blocks → code → blocks must give the same program
      const code = P.codeText(P.parseDsl(def.solution), lang);
      const back = P.parseCode(code, lang);
      ok(back.ok && P.runAll(def, back.program).ok && P.count(back.program) === def.best, `${name}: ${lang} code round-trip works`);
    }
    if (def.tip) {
      for (const m of (def.tip.text + def.tip.simple + def.tip.notes.python + def.tip.notes.c).matchAll(/\{([฀-๿]+)\}/g)) ok(WORDS[m[1]], `${name}: word {${m[1]}} is in the word list`);
      if (ch.id !== 'var') for (const lang of ['python', 'c']) ok(P.parseCode(def.tip.code[lang], lang).ok, `${name}: tip example is valid ${lang}`);
    }
  }
  // the parsers: accepted variants and helpful errors
  const pc = (t, l) => P.parseCode(t, l);
  ok(P.count(pc('for (i = 1; i <= 3; i += 1) { move(); }', 'c').program) === 2 && pc('for (i = 1; i <= 3; i += 1) { move(); }', 'c').program[0].n === 3, 'C: for (i = 1; i <= 3; i += 1) loops 3 times');
  ok(pc('for i in range(2):\n    move()\nturn_left()', 'python').program.length === 2, 'Python: indentation ends the loop body');
  const e1 = pc('move()\nfor i in range(3)\n    move()', 'python');
  ok(!e1.ok && e1.line === 2 && e1.msg.includes(':'), 'Python error: missing colon on line 2 → ' + e1.msg);
  const e2 = pc('move();\nturn_right()\nmove();', 'c');
  ok(!e2.ok && e2.line === 2 && e2.msg.includes(';'), 'C error: missing semicolon on line 2 → ' + e2.msg);
  const e3 = pc('Move()', 'python');
  ok(!e3.ok && e3.msg.includes('move'), 'error: Move() → ' + e3.msg);
  const e4 = pc('#include <stdio.h>\nmove();', 'c');
  ok(!e4.ok && e4.msg.includes('#include'), 'C error: #include → ' + e4.msg);
  const e5 = pc('if (wall_ahead()) {\n  move();\n', 'c');
  ok(!e5.ok && e5.msg.includes('}'), 'C error: missing } → ' + e5.msg);
  const e6 = pc('move()\n    move()', 'python');
  ok(!e6.ok && e6.line === 2, 'Python error: unexpected indent → ' + e6.msg);

  // ---- 2. start screen: choose a language ----
  ok($('.start') && $$('.lang-card').length === 2, 'first visit shows the language picker');
  $('.lang-card[data-lang="c"]').click();
  await wait(100);
  ok($('.puzzle'), 'choosing C opens level 1');
  ok($('#tipBox') && $('#tipBox').open && $('#tipBox .code').textContent.includes('move();'), 'level 1 tip is open and shows C code');

  // ---- read aloud: every sentence has a pre-made file, and 🔊 plays it ----
  const speech = w.SPEECH.all();
  const missing = speech.filter((x) => !x.has);
  ok(speech.length > 150 && missing.length === 0, `every spoken sentence has an audio file (${speech.length} sentences, ${missing.length} missing: ${missing.slice(0, 3).map((x) => x.text).join(' | ')})`);
  const played = [];
  const RealAudio = w.Audio;
  w.Audio = function (src) { played.push(src); const a = new RealAudio(src); a.play = () => Promise.resolve(); return a; };
  $('#tipRead').click();
  ok(played.length === 1 && /^audio\/[0-9a-f]{8}\.mp3$/.test(played[0]), 'tip 🔊 plays a pre-made file: ' + played[0]);
  const res = await fetch(new URL(played[0], f.contentWindow.location.href));
  ok(res.ok && (res.headers.get('content-type') || '').includes('audio'), 'that audio file is served: ' + res.status + ' ' + res.headers.get('content-type'));
  $('#tipRead').click(); // press again = stop
  ok($('#tipRead').getAttribute('aria-pressed') === 'false', 'pressing 🔊 again stops it');
  w.Audio = RealAudio;
  ok(w.CONTENT.CHAPTERS[2].levels[0].tip.notes.c.includes('{ }'), 'sanity: the loop tip note for C contains { }');

  // ---- 3. play every level ----
  for (let i = 0; i < LEVELS.length; i++) {
    const { ch, def, k } = LEVELS[i];
    const name = `${ch.id} ${k + 1}`;
    let ran = false;
    if (i > 0) { w.location.hash = `#/level/${i}`; await wait(80); }
    ok($('.puzzle'), `${name}: level opens (unlocked)`);
    if (i === 0) {
      ok($('#pzTypeTab').disabled, 'typing mode is locked at the start');
      ok($('#pzStep').disabled && $('#pzStep').textContent.includes('🔒'), 'step mode is locked at 0 stars');
      ok(!visible($('#pzSolve')), 'the solution button is hidden before any failed run');
      for (let n = 0; n < 3; n++) $('[data-add="move"]').click();
      ok($$('#pzProg .pz-code').map((c) => c.textContent).join('|') === 'move();|move();|move();', 'tapped blocks show as C code');
      noHScroll('level 1');
    } else if (i === 1) {
      $('[data-add="move"]').click();
      $('#pzGo').click();
      ok(await until(() => $('#pzCoach').textContent.includes('คำใบ้')), 'a failed run gives a hint');
      $('#pzGo').click();
      await until(() => !$('#pzGo').disabled);
      ok(visible($('#pzSolve')), 'after 2 fails the solution button appears');
      $('#pzSolve').click();
    } else if (i === 5) { // chapter 2, level 1: typing mode is now unlocked; type C code with a mistake first
      ok(!$('#pzTypeTab').disabled, 'typing mode unlocks after chapter 1');
      $('#pzTypeTab').click();
      ok(visible($('#pzText')), 'typing box is shown');
      $('#pzText').value = 'move();\npick_gem()\nmove();';
      $('#pzGo').click();
      ok(visible($('#pzError')) && $('#pzError').textContent.includes('บรรทัด 2'), 'typed error shows the line: ' + $('#pzError').textContent);
      $('#pzText').value = 'move();\npick_gem();\nmove();\nmove();\npick_gem();\nmove();';
    } else if (i === 7) { // loop tip in C must still show the braces
      ok($('#tipBox .tip-note').textContent.includes('{ }'), 'C tip note keeps the literal { } braces');
      $('#pzSolve').click();
    } else if (i === 8) { // loops: typed C with a for loop
      $('#pzTypeTab').click();
      $('#pzText').value = 'for (int i = 0; i < 3; i++) {\n    move();\n    move();\n}'; // runs, but crashes into a rock
      $('#pzGo').click();
      ok(await until(() => !$('#pzGo').disabled && $('#pzCoach').textContent.includes('บรรทัด')), 'typed run that crashes names the line: ' + $('#pzCoach').textContent.slice(0, 60));
      $('#pzText').value = 'for (int i = 0; i < 3; i++) {\n    move();\n    turn_right();\n    move();\n    turn_left();\n}';
    } else if (i === 10) { // switch to Python in the middle of a level; the program follows
      $('#pzSolve').click();
      $$('#segLang button').find((b) => b.dataset.v === 'python').click();
      await wait(50);
      ok($$('#pzProg .pz-code')[0].textContent.startsWith('for i in range('), 'switching language redraws the program in Python');
      ok($('#tipBox') === null || !$('#tipBox .code').textContent.includes(';'), 'tip follows the language');
    } else if (i === 11) { // Python typed: if/else inside a loop
      $('#pzTypeTab').click();
      $('#pzText').value = 'for i in range(11):\n    if wall_ahead():\n        turn_right()\n    else:\n        move()';
    } else if (i === 17) { // debug level in C-like nesting, check layout, then fix by solution
      noHScroll('nested debug level (Python)');
      $$('#segLang button').find((b) => b.dataset.v === 'c').click();
      await wait(50);
      noHScroll('nested debug level (C)');
      $('#pzSolve').click();
    } else if (i === 13) { // step mode: next step, the if explains itself, then run the rest
      ok(!$('#pzStep').disabled, 'step mode unlocked after 5 stars');
      $('#pzSolve').click();
      $('#pzStep').click();
      ok(visible($('#pzStepBar')), 'step bar appears');
      await until(() => $('#pzCoach').textContent.includes('ขั้นที่ 1'));
      ok($('#pzCoach').textContent.includes('move'), 'step 1 explained: ' + $('#pzCoach').textContent.slice(0, 50));
      $('#pzNextStep').click();
      ok(await until(() => $('#pzCoach').textContent.includes('ขั้นที่ 2') && $('#pzCoach').textContent.includes('จริง')), 'step 2 says the if is true: ' + $('#pzCoach').textContent.slice(0, 60));
      $('#pzRest').click();
      ran = true;
    } else if (i === 14) { // step mode: stop in the middle
      $('#pzSolve').click();
      $('#pzStep').click();
      await until(() => $('#pzCoach').textContent.includes('ขั้นที่ 1'));
      $('#pzStop').click();
      ok(await until(() => !visible($('#pzStepBar')) && !$('#pzGo').disabled), 'stop ends step mode and the editor works again');
    } else {
      $('#pzSolve').click(); // load the solution
    }
    if (!ran) $('#pzGo').click();
    const won = await until(() => $('#pzResult .pz-win'), 8000);
    ok(won, `${name}: solved on screen`);
    if (!won) { log.push('   coach says: ' + ($('#pzCoach') || {}).textContent); break; }
    $('#pzNext').click(); await wait(80);
  }

  // ---- 4. challenge levels and Bit colors ----
  w.location.hash = '#/'; await wait(80);
  ok($$('.lvl.challenge.locked').length >= 1, 'challenge levels stay locked without enough stars');
  // give 3 stars on every main level, then reload
  const p0 = JSON.parse(localStorage.getItem('vct3-progress'));
  LEVELS.forEach(({ ch, k }) => { p0.stars[`${ch.id}-${k + 1}`] = 3; });
  localStorage.setItem('vct3-progress', JSON.stringify(p0));
  w.location.reload();
  await wait(300);
  await until(() => f.contentDocument.querySelector('#app .home'), 20000);
  w = f.contentWindow; d = f.contentDocument; w.PUZZLE_DELAY = 0;
  w.addEventListener('error', (e) => errs.push(e.message));
  ok($$('.lvl.challenge.open').length === 6, 'all 6 challenge levels unlock with 3 stars everywhere');
  for (let ci = 0; ci < 6; ci++) {
    w.location.hash = `#/challenge/${ci}`; await wait(80);
    const def = CHAPTERS[ci].challenge;
    ok($('.puzzle') && $('h1').textContent.includes('ท้าทาย'), `challenge ${ci + 1} opens`);
    if (ci === 2) { // nested loops, typed in C
      ok($('#tipBox') && $('#tipBox').open, 'nested-loop challenge shows its tip');
      $('#pzTypeTab').click();
      $('#pzText').value = 'for (int i = 0; i < 2; i++) {\n    for (int j = 0; j < 3; j++) {\n        move();\n    }\n    turn_right();\n    for (int j = 0; j < 3; j++) {\n        move();\n    }\n    turn_left();\n}';
    } else {
      if (def.start) ok($$('#pzProg .pz-node').length === 7, 'debug challenge starts with the buggy nested program');
      $('#pzSolve').click();
    }
    $('#pzGo').click();
    const won = await until(() => $('#pzResult .pz-win'), 8000);
    ok(won, `challenge ${ci + 1} solved on screen`);
    if (ci === 2 && won) ok($$('.pz-win .big-stars .star.on').length === 3, 'typed nested loop gets 3 stars');
    if (!won) log.push('   coach says: ' + $('#pzCoach').textContent);
  }
  w.location.hash = '#/'; await wait(80);
  const gold = $('[data-color="gold"]');
  ok(gold && !gold.disabled, 'gold color unlocked with many stars');
  gold.click();
  ok(d.documentElement.style.getPropertyValue('--bit') === '#c99a06', 'choosing gold sets Bit color');
  ok(w.getComputedStyle($('.m-head')).fill === 'rgb(201, 154, 6)', 'Bit is drawn in gold');
  noHScroll('home with rewards');

  // ---- 5. teacher: build a pack, test it, share it, play it as a student ----
  localStorage.removeItem('vct-teacher-pack');
  w.location.hash = '#/teach'; await wait(100);
  ok($('.teach') && $$('.ed-cell').length === 15, 'teacher editor opens with a 3×5 map');
  ok(!$('#edShare'), 'sharing is locked until every level is tested');
  const draftNow = () => JSON.parse(localStorage.getItem('vct-teacher-pack'));
  $('[data-tool="#"]').click();
  $('.ed-cell[data-r="0"][data-c="2"]').click();
  ok(draftNow().levels[0].grid[0] === 'S.#..', 'tapping with the rock tool draws a rock');
  $('.ed-cell[data-r="0"][data-c="0"]').click();
  ok(draftNow().levels[0].grid[0][0] === 'S', 'the start cannot be painted over');
  $('[data-block="repeat"]').click();
  ok(draftNow().levels[0].blocks.includes('repeat'), 'teacher can allow the loop block');
  const title = $('#edTitle');
  title.value = 'หลบหินก้อนแรก'; title.dispatchEvent(new w.Event('input'));
  ok(draftNow().levels[0].title === 'หลบหินก้อนแรก', 'level title is saved as the teacher types');
  $('#edTest').click(); await wait(120);
  ok($('.puzzle') && $('h1').textContent.includes('ทดสอบ'), 'test run opens the level');
  $('#pzTypeTab').click();
  $('#pzText').value = 'turn_right();\nmove();\nmove();\nturn_left();\nfor (int i = 0; i < 4; i++) {\n    move();\n}';
  $('#pzGo').click();
  ok(await until(() => $('#pzResult .pz-win')), 'teacher solves own level');
  $('#pzNext').click(); await wait(120);
  ok($('.ed-status.ok') && draftNow().levels[0].best === 6, 'level marked tested, 3-star target = 6 blocks: ' + ($('.ed-status') || {}).textContent);
  $('#edAdd').click(); await wait(50);
  ok(draftNow().levels.length === 2 && !$('#edShare'), 'a new level needs testing before sharing');
  $('#edTest').click(); await wait(120);
  for (const b of ['right', 'move', 'move', 'left', 'move', 'move', 'move', 'move']) $(`[data-add="${b}"]`).click();
  $('#pzGo').click();
  ok(await until(() => $('#pzResult .pz-win')), 'teacher solves level 2 by tapping');
  $('#pzNext').click(); await wait(120);
  ok($('#edShare'), 'sharing unlocks when all levels are tested');
  $('#edShare').click();
  const urlBox = await until(() => $('#shareUrl'));
  const url = urlBox ? urlBox.value : '';
  ok(url.includes('#/pack/z'), 'share makes a compressed pack link (' + url.length + ' characters)');
  ok($('#shareQr svg'), 'share shows a QR code');
  const code = url.split('#/pack/')[1];
  const pack = await w.Teacher.decodePack(code);
  ok(pack.levels.length === 2 && pack.levels[0].best === 6 && pack.levels[0].title === 'หลบหินก้อนแรก', 'the link holds the whole pack');
  let rejected = false;
  try { await w.Teacher.decodePack(code.slice(0, -6) + 'AAAAAA'); } catch (e) { rejected = true; }
  ok(rejected, 'a broken or edited link is rejected');
  // play as a student
  w.location.hash = `#/pack/${code}`;
  ok(await until(() => $('.pack')), 'student opens the pack link');
  ok($$('.pack .lvl').length === 2 && $$('.pack .lvl.locked').length === 1, 'pack shows 2 levels, the second locked');
  $('.pack a.lvl').click();
  ok(await until(() => $('.puzzle')), 'student plays level 1 of the pack');
  $('#pzTypeTab').click();
  $('#pzText').value = 'turn_right();\nmove();\nmove();\nturn_left();\nfor (int i = 0; i < 4; i++) {\n    move();\n}';
  $('#pzGo').click();
  ok(await until(() => $('#pzResult .pz-win')) && $$('.pz-win .big-stars .star.on').length === 3, 'student gets 3 stars by matching the teacher');
  $('#pzNext').click();
  ok(await until(() => $('.puzzle') && $('h1').textContent.includes('ด่าน 2/2')), 'next goes to level 2 of the pack');
  w.location.hash = '#/pack/' + code.slice(0, -6) + 'AAAAAA';
  ok(await until(() => $('.screen') && $('.screen').textContent.includes('เปิดไม่ได้')), 'a broken link shows a friendly message');
  w.location.hash = '#/'; await wait(100);
  ok($('.teach-card'), 'home has the teacher card');

  // ---- 6. saving, rewards, settings ----
  const p = JSON.parse(localStorage.getItem('vct3-progress'));
  ok(Object.keys(p.stars).length === LEVELS.length + 6, 'all levels and challenges saved');
  ok(['first', 'persist', 'typist', 'bilingual', 'loop', 'all', 'challenger'].every((b) => p.badges.includes(b)), 'badges: ' + p.badges.join(', '));
  ok(p.xp > 0 && Number($('#levelNum').textContent) >= 2, `XP ${p.xp}, level ${$('#levelNum').textContent}`);
  w.location.hash = '#/'; await wait(80);
  ok($('.home') && $$('.lvl.done').length === LEVELS.length + 6, 'home map shows every level and challenge done');
  noHScroll('home');
  $('#btnTheme').click(); ok(d.documentElement.dataset.theme === 'contrast', 'theme button cycles');
  ok(w.getComputedStyle($('.m-head')).fill === 'rgb(255, 230, 0)', 'high-contrast theme keeps Bit yellow, ignoring the chosen color');
  $('#btnSize').click(); ok(d.documentElement.dataset.size === 'L', 'size button cycles');
  const st = JSON.parse(localStorage.getItem('vct-settings'));
  ok(st.theme === 'contrast' && st.lang === 'c', 'settings saved (theme and language)');
  ok(errs.length === 0, 'no JavaScript errors ' + errs.join(' | '));

  const fails = log.filter((l) => l.startsWith('FAIL')).length;
  document.getElementById('out').textContent = `RESULT ${log.length - fails} passed, ${fails} failed\n` + log.join('\n');
})().catch((e) => { document.getElementById('out').textContent = 'RESULT CRASH ' + e.stack + '\n' + log.join('\n'); });
</script>
